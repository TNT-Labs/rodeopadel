<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestione mini-torneo 2vs2 con 4 giocatori">
    <meta name="theme-color" content="#2196F3">
    <title>Mini Torneo 2vs2</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 Mini Torneo 2vs2</h1>
            <p class="subtitle">Gestisci il tuo torneo con 4 giocatori</p>
        </header>

        <!-- Sezione inserimento giocatori -->
        <section id="players-section" class="card">
            <h2>Giocatori</h2>
            <form id="players-form">
                <div class="players-grid">
                    <div class="input-group">
                        <label for="player1">Giocatore 1</label>
                        <input type="text" id="player1" required placeholder="Nome giocatore">
                    </div>
                    <div class="input-group">
                        <label for="player2">Giocatore 2</label>
                        <input type="text" id="player2" required placeholder="Nome giocatore">
                    </div>
                    <div class="input-group">
                        <label for="player3">Giocatore 3</label>
                        <input type="text" id="player3" required placeholder="Nome giocatore">
                    </div>
                    <div class="input-group">
                        <label for="player4">Giocatore 4</label>
                        <input type="text" id="player4" required placeholder="Nome giocatore">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Genera Calendario</button>
            </form>
        </section>

        <!-- Sezione partite -->
        <section id="matches-section" class="card" style="display: none;">
            <div class="section-header">
                <h2>Partite</h2>
                <button id="reset-btn" class="btn btn-secondary">Reset Torneo</button>
            </div>
            <div id="matches-container"></div>
        </section>

        <!-- Sezione classifica -->
        <section id="ranking-section" class="card" style="display: none;">
            <h2>Classifica</h2>
            <div id="ranking-container"></div>
        </section>
    </div>

    <script src="app.js"></script>
    <script>
        // Registrazione Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registrato'))
                    .catch(err => console.log('Errore registrazione SW:', err));
            });
        }
    </script>
</body>
</html>
